name: Build/release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '手动编译目标'
        required: true
        default: all
        type: choice
        options:
          - all
          - mac
          - win
          - linux

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:compile

  setup:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      release_name: ${{ steps.tag.outputs.release_name }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      build_version: ${{ steps.tag.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if release needed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Get Package Version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate Tag Name
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          TIME_STR=$(date -u +'%Y%m%d.%H%M%S')
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BASE_VERSION="${{ steps.package-version.outputs.version }}"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Stable release triggered by tag
            TAG_NAME=${{ github.ref_name }}
            # Remove 'v' for build version
            BUILD_VERSION=${TAG_NAME#v}
            
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          else
            # Canary/Nightly release
            # Format: v0.1.0-canary.20260215.223038
            CANARY_VER="${BASE_VERSION}-canary.${TIME_STR}"
            TAG_NAME="v${CANARY_VER}"
            
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=Canary ${TAG_NAME} (${SHA_SHORT})" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "build_version=${CANARY_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          body: |
            Automated build for commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
            Version: ${{ steps.tag.outputs.build_version }}
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'mac' || inputs.target == 'all' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      
      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - run: npm run build:mac:${{ matrix.arch }}:only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-artifacts-${{ matrix.arch }}
          path: release/*.dmg
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'win' || inputs.target == 'all' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target: [nsis, portable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - name: Build Windows
        run: node scripts/build-wrapper.js --win ${{ matrix.target }} --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts-${{ matrix.arch }}-${{ matrix.target }}
          path: release/*.exe
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target: [AppImage, deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Linux
        run: node scripts/build-wrapper.js --linux ${{ matrix.target }} --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-artifacts-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [setup, build-mac, build-win, build-linux]
    if: needs.setup.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release body with download links
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"
          VERSION="${{ needs.setup.outputs.build_version }}"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BASE_URL="https://github.com/Xinyuan-LilyGO/LILYGO-Spark/releases/download/${TAG}"
          MIRROR="https://ghfast.top"

          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          find_asset() { echo "$ASSETS" | grep "$1" | head -1; }

          WIN_X64_SETUP=$(find_asset "windows-x64-setup.exe")
          MAC_ARM64_DMG=$(find_asset "macOS-arm64.dmg")
          MAC_X64_DMG=$(find_asset "macOS-x64.dmg")
          LINUX_X64_APPIMAGE=$(find_asset "linux-x86_64.AppImage")

          {
            echo "## 📦 Quick Download / 快速下载"
            echo ""
            echo "| Platform | Download | 国内加速 ⚡ |"
            echo "|----------|----------|------------|"
            [ -n "$WIN_X64_SETUP" ] && echo "| 🪟 Windows x64 (Installer) | [⬇️ Download](${BASE_URL}/${WIN_X64_SETUP}) | [⚡ 加速下载](${MIRROR}/${BASE_URL}/${WIN_X64_SETUP}) |"
            [ -n "$MAC_ARM64_DMG" ] && echo "| 🍎 macOS Apple Silicon | [⬇️ Download](${BASE_URL}/${MAC_ARM64_DMG}) | [⚡ 加速下载](${MIRROR}/${BASE_URL}/${MAC_ARM64_DMG}) |"
            [ -n "$MAC_X64_DMG" ] && echo "| 🍎 macOS Intel | [⬇️ Download](${BASE_URL}/${MAC_X64_DMG}) | [⚡ 加速下载](${MIRROR}/${BASE_URL}/${MAC_X64_DMG}) |"
            [ -n "$LINUX_X64_APPIMAGE" ] && echo "| 🐧 Linux x64 (AppImage) | [⬇️ Download](${BASE_URL}/${LINUX_X64_APPIMAGE}) | [⚡ 加速下载](${MIRROR}/${BASE_URL}/${LINUX_X64_APPIMAGE}) |"
            echo ""
            echo "> 💡 如果 GitHub 下载速度慢，请使用「国内加速 ⚡」链接。更多平台/格式请展开下方 **Assets** 列表。"
            echo ""
            echo "---"
            echo ""
            echo "Automated build for commit ${SHA_SHORT} · Triggered by: ${{ github.event_name }} · Version: \`${VERSION}\`"
          } > /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old builds
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Keep last 20 releases
          RELEASES_TO_DELETE=$(gh release list --limit 100 | grep "canary" | awk '{print $1}' | tail -n +21)
          if [ -n "$RELEASES_TO_DELETE" ]; then
            for TAG in $RELEASES_TO_DELETE; do
              gh release delete "$TAG" --yes --cleanup-tag
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
