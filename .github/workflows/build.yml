name: Build/release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '手动编译目标'
        required: true
        default: all
        type: choice
        options:
          - all
          - mac
          - win
          - linux
      notarize:
        description: 'macOS 公证 (Notarize)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:compile

  setup:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      release_name: ${{ steps.tag.outputs.release_name }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      build_version: ${{ steps.tag.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if release needed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Get Package Version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate Tag Name
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          TIME_STR=$(date -u +'%Y%m%d.%H%M%S')
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BASE_VERSION="${{ steps.package-version.outputs.version }}"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Stable release triggered by tag
            TAG_NAME=${{ github.ref_name }}
            # Remove 'v' for build version
            BUILD_VERSION=${TAG_NAME#v}
            
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          else
            # Canary/Nightly release
            # Format: v0.1.0-canary.20260215.223038
            CANARY_VER="${BASE_VERSION}-canary.${TIME_STR}"
            TAG_NAME="v${CANARY_VER}"
            
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=Canary (${SHA_SHORT})" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "build_version=${CANARY_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          body: |
            Automated build for commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
            Version: ${{ steps.tag.outputs.build_version }}
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'mac' || inputs.target == 'all' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Import Code-Signing Certificate
        env:
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        if: env.MAC_CERTS_P12 != ''
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_P12 }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: List available signing identities
        run: |
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning | head -20
          echo "==================================="

      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - name: Determine notarization flag
        id: notarize
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "Tag push detected — notarization ON"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "enabled=${{ inputs.notarize }}" >> $GITHUB_OUTPUT
            echo "Manual dispatch — notarization=${{ inputs.notarize }}"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Regular push — notarization OFF"
          fi
      - run: npm run build:mac:${{ matrix.arch }}:only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}

      - name: Verify code signing
        run: |
          echo "========== Post-Build Signing Verification =========="
          APP_PATH=$(find release -name "*.app" -maxdepth 3 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️  No .app bundle found — skipping"
            ls -R release/ || true
            exit 0
          fi
          echo "📦 App: $APP_PATH"

          echo "--- codesign -dv ---"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true

          echo "--- codesign --verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 && \
            echo "✅ Signature OK" || echo "❌ Signature FAILED"

          TEAM=$(codesign -dv "$APP_PATH" 2>&1 | grep "TeamIdentifier=" || echo "NONE")
          echo "  $TEAM"
          if echo "$TEAM" | grep -q "not set"; then
            echo "❌ TeamIdentifier not set — signing failed!"
            exit 1
          fi

          echo "--- spctl --assess ---"
          spctl --assess --type execute --verbose=2 "$APP_PATH" 2>&1 && \
            echo "✅ Gatekeeper OK" || \
            echo "⚠️  Gatekeeper rejected (expected without notarization)"
          echo "========== Signing Verification Complete =========="

      - name: Notarize DMG and ZIP
        if: steps.notarize.outputs.enabled == 'true'
        timeout-minutes: 40
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "========== Notarization (submit → poll → staple) =========="
          NOTARIZE_FILES=()
          for f in release/*.dmg release/*.zip; do
            [ -f "$f" ] && NOTARIZE_FILES+=("$f")
          done

          if [ ${#NOTARIZE_FILES[@]} -eq 0 ]; then
            echo "⚠️  No DMG/ZIP found to notarize"
            exit 0
          fi

          for FILE in "${NOTARIZE_FILES[@]}"; do
            echo ""
            echo "━━━ Notarizing: $(basename "$FILE") ━━━"

            # Step 1: Submit (fast, just uploads)
            echo "[1/3] Submitting to Apple..."
            SUBMIT_OUT=$(xcrun notarytool submit "$FILE" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>&1) || true
            echo "$SUBMIT_OUT"

            SUB_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
            if [ -z "$SUB_ID" ]; then
              echo "❌ Submit failed — no submission ID returned"
              echo "$SUBMIT_OUT"
              exit 1
            fi
            echo "📋 Submission ID: $SUB_ID"

            # Step 2: Poll with retry (resilient to transient network errors)
            echo "[2/3] Polling for result (max 30 min, 60s intervals)..."
            FINAL_STATUS="timeout"
            for i in $(seq 1 30); do
              sleep 60
              INFO_OUT=$(xcrun notarytool info "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json 2>&1) || true

              STATUS=$(echo "$INFO_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "poll_error")
              echo "  ⏳ Attempt $i/30: status=$STATUS"

              if [ "$STATUS" = "Accepted" ]; then
                FINAL_STATUS="Accepted"
                break
              elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
                FINAL_STATUS="$STATUS"
                echo "❌ Notarization $STATUS — fetching log..."
                xcrun notarytool log "$SUB_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" 2>&1 || true
                exit 1
              fi
              # "In Progress" or network error → just retry next loop
            done

            if [ "$FINAL_STATUS" != "Accepted" ]; then
              echo "⚠️  Notarization timed out after 30 min (status=$FINAL_STATUS)"
              echo "    App is signed but NOT notarized. Users can right-click → Open."
              continue
            fi

            # Step 3: Staple
            echo "[3/3] Stapling notarization ticket..."
            xcrun stapler staple "$FILE" 2>&1 && \
              echo "✅ $(basename "$FILE") notarized and stapled!" || \
              echo "⚠️  Staple failed (notarization valid but ticket not attached)"
          done
          echo "========== Notarization Complete =========="

      - name: Verify notarization staple
        if: steps.notarize.outputs.enabled == 'true'
        run: |
          for f in release/*.dmg release/*.zip; do
            [ -f "$f" ] || continue
            echo "Checking: $f"
            xcrun stapler validate "$f" 2>&1 && \
              echo "✅ Staple valid: $f" || \
              echo "⚠️  No staple: $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-artifacts-${{ matrix.arch }}
          path: release/*.dmg
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'win' || inputs.target == 'all' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target: [nsis, portable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - name: Build Windows
        run: node scripts/build-wrapper.js --win ${{ matrix.target }} --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts-${{ matrix.arch }}-${{ matrix.target }}
          path: release/*.exe
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target: [AppImage, deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Linux
        run: node scripts/build-wrapper.js --linux ${{ matrix.target }} --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-artifacts-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [setup, build-mac, build-win, build-linux]
    if: needs.setup.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release body with download links and changelog
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"
          VERSION="${{ needs.setup.outputs.build_version }}"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BASE_URL="https://github.com/Xinyuan-LilyGO/LILYGO-Spark/releases/download/${TAG}"
          MIRRORS=(
            "ghfast.top"
            "gh-proxy.com"
            "ghproxy.cc"
            "github.moeyy.xyz"
          )
          REPO="Xinyuan-LilyGO/LILYGO-Spark"

          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          find_asset() { echo "$ASSETS" | grep "$1" | head -1; }

          WIN_X64_SETUP=$(find_asset "windows-x64-setup.exe")
          MAC_ARM64_DMG=$(find_asset "macOS-arm64.dmg")
          MAC_X64_DMG=$(find_asset "macOS-x64.dmg")
          LINUX_X64_APPIMAGE=$(find_asset "linux-x86_64.AppImage")

          # Find previous tag for changelog range
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline -20 --format="- %s (\`%h\`)")
          else
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD" --format="- %s (\`%h\`)")
          fi

          # Extract Chinese lines from bilingual commits, or auto-translate prefixes as fallback
          COMMITS_ZH=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Try to extract Chinese summary from multi-line commit (second paragraph)
            sha=$(echo "$line" | grep -oP '\(`[a-f0-9]+`\)$' || true)
            translated=$(echo "$line" \
              | sed 's/^- Add /- 新增 /; s/^- Fix /- 修复 /; s/^- Improve /- 改进 /; s/^- Update /- 更新 /' \
              | sed 's/^- Implement /- 实现 /; s/^- Refactor/- 重构/; s/^- Remove /- 移除 /' \
              | sed 's/^- Clean/- 清理/; s/^- Rename/- 重命名/; s/^- Replace/- 替换/')
            COMMITS_ZH="${COMMITS_ZH}${translated}"$'\n'
          done <<< "$COMMITS"

          mirror_links() {
            local file="$1"
            local links=""
            local i=1
            for m in "${MIRRORS[@]}"; do
              links="${links}[加速${i}](https://${m}/${BASE_URL}/${file}) · "
              i=$((i+1))
            done
            echo "${links% · }"
          }

          {
            echo "## 📦 Quick Download / 快速下载"
            echo ""
            echo "| Platform | Download | 国内加速 ⚡ |"
            echo "|----------|----------|------------|"
            [ -n "$WIN_X64_SETUP" ] && echo "| 🪟 Windows x64 (Installer) | [⬇️ Download](${BASE_URL}/${WIN_X64_SETUP}) | $(mirror_links "$WIN_X64_SETUP") |"
            [ -n "$MAC_ARM64_DMG" ] && echo "| 🍎 macOS Apple Silicon | [⬇️ Download](${BASE_URL}/${MAC_ARM64_DMG}) | $(mirror_links "$MAC_ARM64_DMG") |"
            [ -n "$MAC_X64_DMG" ] && echo "| 🍎 macOS Intel | [⬇️ Download](${BASE_URL}/${MAC_X64_DMG}) | $(mirror_links "$MAC_X64_DMG") |"
            [ -n "$LINUX_X64_APPIMAGE" ] && echo "| 🐧 Linux x64 (AppImage) | [⬇️ Download](${BASE_URL}/${LINUX_X64_APPIMAGE}) | $(mirror_links "$LINUX_X64_APPIMAGE") |"
            echo ""
            echo "> 💡 如果 GitHub 下载速度慢，请使用「国内加速 ⚡」链接，任选一个可用的镜像即可。更多平台/格式请展开下方 **Assets** 列表。"
            echo ""
            echo "---"
            echo ""
            echo "## 📝 What's Changed / 更新内容"
            echo ""
            echo "<details open><summary><b>English</b></summary>"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "</details>"
            echo ""
            echo "<details open><summary><b>中文</b></summary>"
            echo ""
            echo "$COMMITS_ZH"
            echo "</details>"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: [${PREV_TAG}...${TAG}](https://github.com/${REPO}/compare/${PREV_TAG}...${TAG})"
            fi
            echo ""
            echo "---"
            echo ""
            echo "Automated build for commit ${SHA_SHORT} · Triggered by: ${{ github.event_name }} · Version: \`${VERSION}\`"
          } > /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old builds
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Keep last 20 canary releases, delete older ones
          TAGS=$(gh release list --limit 100 --json tagName,isPrerelease -q '[.[] | select(.isPrerelease) | .tagName] | .[20:][]')
          for TAG in $TAGS; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
