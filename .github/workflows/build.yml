name: Build/release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '手动编译目标'
        required: true
        default: all
        type: choice
        options:
          - all
          - mac
          - win
          - linux
      # Notarization runs automatically after build; manual fallback in notarize.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:compile

  setup:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      release_name: ${{ steps.tag.outputs.release_name }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      build_version: ${{ steps.tag.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if release needed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Get Package Version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate Tag Name
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          TIME_STR=$(date -u +'%y%m%d.%H%M%S')
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BASE_VERSION="${{ steps.package-version.outputs.version }}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Stable release triggered by tag
            TAG_NAME=${{ github.ref_name }}
            # Remove 'v' for build version
            BUILD_VERSION=${TAG_NAME#v}

            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          else
            # Canary/Nightly release
            # Format: v0.1.0-canary.260325.020441
            CANARY_VER="${BASE_VERSION}-canary.${TIME_STR}"
            TAG_NAME="v${CANARY_VER}"

            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG_NAME} (${SHA_SHORT})" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "build_version=${CANARY_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          body: |
            Automated build for commit ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
            Version: ${{ steps.tag.outputs.build_version }}
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'mac' || inputs.target == 'all' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Import Code-Signing Certificate
        env:
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        if: env.MAC_CERTS_P12 != ''
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_P12 }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: List available signing identities
        run: |
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning | head -20
          echo "==================================="

      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - run: npm run build:mac:${{ matrix.arch }}:only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
          # electron-builder skips code signing on PR builds by default (a fork-PR
          # safety). This repo's PRs are same-repo, so the Developer ID cert is
          # available — force real signing so PR builds match release builds and
          # pass the "Verify code signing" TeamIdentifier check below.
          CSC_FOR_PULL_REQUEST: "true"

      - name: Verify code signing
        run: |
          echo "========== Post-Build Signing Verification =========="
          APP_PATH=$(find release -name "*.app" -maxdepth 3 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️  No .app bundle found — skipping"
            ls -R release/ || true
            exit 0
          fi
          echo "📦 App: $APP_PATH"

          echo "--- codesign -dv ---"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true

          echo "--- codesign --verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 && \
            echo "✅ Signature OK" || echo "❌ Signature FAILED"

          TEAM=$(codesign -dv "$APP_PATH" 2>&1 | grep "TeamIdentifier=" || echo "NONE")
          echo "  $TEAM"
          if echo "$TEAM" | grep -q "not set"; then
            echo "❌ TeamIdentifier not set — signing failed!"
            exit 1
          fi

          echo "--- spctl --assess ---"
          spctl --assess --type execute --verbose=2 "$APP_PATH" 2>&1 && \
            echo "✅ Gatekeeper OK" || \
            echo "⚠️  Gatekeeper rejected (expected without notarization)"
          echo "========== Signing Verification Complete =========="

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-artifacts-${{ matrix.arch }}
          path: release/*.dmg
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'win' || inputs.target == 'all' }}
    # Pin to windows-2022 (VS 2022). windows-latest moved to windows-2025-vs2026,
    # whose Visual Studio 2026 is not detected by the node-gyp bundled with Node
    # 20, breaking the native rebuild of @serialport/bindings-cpp.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target: [nsis, portable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - name: Build Windows
        run: node scripts/build-wrapper.js --win ${{ matrix.target }} --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts-${{ matrix.arch }}-${{ matrix.target }}
          path: release/*.exe
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target: [AppImage, deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache electron dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci

      - name: Set Version
        if: needs.setup.outputs.should_release == 'true'
        run: npm version ${{ needs.setup.outputs.build_version }} --no-git-tag-version

      - run: npm run prebuild
      - run: npm run build:compile
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Linux
        run: node scripts/build-wrapper.js --linux ${{ matrix.target }} --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-artifacts-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
      - name: Upload to Release
        if: needs.setup.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [setup, build-mac, build-win, build-linux]
    if: needs.setup.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release body with download links and changelog
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"
          VERSION="${{ needs.setup.outputs.build_version }}"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BASE_URL="https://github.com/Xinyuan-LilyGO/LILYGO-Spark/releases/download/${TAG}"
          MIRRORS=(
            "ghfast.top"
            "gh-proxy.com"
            "ghproxy.cc"
            "github.moeyy.xyz"
          )
          REPO="Xinyuan-LilyGO/LILYGO-Spark"

          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          find_asset() { echo "$ASSETS" | grep "$1" | head -1; }

          WIN_X64_SETUP=$(find_asset "windows-x64-setup.exe")
          MAC_ARM64_DMG=$(find_asset "macOS-arm64.dmg")
          MAC_X64_DMG=$(find_asset "macOS-x64.dmg")
          LINUX_X64_APPIMAGE=$(find_asset "linux-x86_64.AppImage")

          # Find previous tag for changelog range
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline -20 --format="- %s (\`%h\`)")
          else
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD" --format="- %s (\`%h\`)")
          fi

          # Extract Chinese lines from bilingual commits, or auto-translate prefixes as fallback
          COMMITS_ZH=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Try to extract Chinese summary from multi-line commit (second paragraph)
            sha=$(echo "$line" | grep -oP '\(`[a-f0-9]+`\)$' || true)
            translated=$(echo "$line" \
              | sed 's/^- Add /- 新增 /; s/^- Fix /- 修复 /; s/^- Improve /- 改进 /; s/^- Update /- 更新 /' \
              | sed 's/^- Implement /- 实现 /; s/^- Refactor/- 重构/; s/^- Remove /- 移除 /' \
              | sed 's/^- Clean/- 清理/; s/^- Rename/- 重命名/; s/^- Replace/- 替换/')
            COMMITS_ZH="${COMMITS_ZH}${translated}"$'\n'
          done <<< "$COMMITS"

          mirror_links() {
            local file="$1"
            local links=""
            local i=1
            for m in "${MIRRORS[@]}"; do
              links="${links}[加速${i}](https://${m}/${BASE_URL}/${file}) · "
              i=$((i+1))
            done
            echo "${links% · }"
          }

          {
            echo "## 📦 Quick Download / 快速下载"
            echo ""
            echo "| Platform | Download | 国内加速 ⚡ |"
            echo "|----------|----------|------------|"
            [ -n "$WIN_X64_SETUP" ] && echo "| 🪟 Windows x64 (Installer) | [⬇️ Download](${BASE_URL}/${WIN_X64_SETUP}) | $(mirror_links "$WIN_X64_SETUP") |"
            [ -n "$MAC_ARM64_DMG" ] && echo "| 🍎 macOS Apple Silicon | [⬇️ Download](${BASE_URL}/${MAC_ARM64_DMG}) | $(mirror_links "$MAC_ARM64_DMG") |"
            [ -n "$MAC_X64_DMG" ] && echo "| 🍎 macOS Intel | [⬇️ Download](${BASE_URL}/${MAC_X64_DMG}) | $(mirror_links "$MAC_X64_DMG") |"
            [ -n "$LINUX_X64_APPIMAGE" ] && echo "| 🐧 Linux x64 (AppImage) | [⬇️ Download](${BASE_URL}/${LINUX_X64_APPIMAGE}) | $(mirror_links "$LINUX_X64_APPIMAGE") |"
            echo ""
            echo "> 💡 如果 GitHub 下载速度慢，请使用「国内加速 ⚡」链接，任选一个可用的镜像即可。更多平台/格式请展开下方 **Assets** 列表。"
            echo ""
            echo "---"
            echo ""
            echo "## 📝 What's Changed / 更新内容"
            echo ""
            echo "<details open><summary><b>English</b></summary>"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "</details>"
            echo ""
            echo "<details open><summary><b>中文</b></summary>"
            echo ""
            echo "$COMMITS_ZH"
            echo "</details>"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: [${PREV_TAG}...${TAG}](https://github.com/${REPO}/compare/${PREV_TAG}...${TAG})"
            fi
            echo ""
            echo "---"
            echo ""
            echo "Automated build for commit ${SHA_SHORT} · Triggered by: ${{ github.event_name }} · Version: \`${VERSION}\`"
          } > /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old builds
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Keep last 20 canary releases, delete older ones
          TAGS=$(gh release list --limit 100 --json tagName,isPrerelease -q '[.[] | select(.isPrerelease) | .tagName] | .[20:][]')
          for TAG in $TAGS; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notarize:
    needs: [setup, build-mac, finalize]
    if: >-
      needs.setup.outputs.should_release == 'true' &&
      needs.build-mac.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download DMGs from release
        id: download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/notarize-common.sh
          download_release_dmgs "${{ needs.setup.outputs.tag_name }}" /tmp/dmgs

      - name: Submit, wait, and staple
        id: notarize-step
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          source .github/scripts/notarize-common.sh
          submit_wait_staple /tmp/dmgs
          echo "status=$(cat /tmp/notarize-status.txt)" >> $GITHUB_OUTPUT

      - name: Re-upload stapled DMGs
        if: always() && steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/notarize-common.sh
          reupload_stapled "${{ needs.setup.outputs.tag_name }}" /tmp/dmgs

      - name: Update release notes
        if: always() && steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/notarize-common.sh
          TAG="${{ needs.setup.outputs.tag_name }}"

          if [ "$(cat /tmp/notarize-status.txt 2>/dev/null)" = "true" ]; then
            update_release_notarization "$TAG" \
              "✅ Notarized & Stapled" \
              "> DMG 已包含 Apple 公证票据 (stapled)，离线安装也可通过 Gatekeeper 验证。" \
              /tmp/notarize-results.md
          else
            update_release_notarization "$TAG" \
              "⚠️ Partially completed" \
              "> 部分文件未完成公证或 staple，请检查状态后手动运行 notarize workflow。" \
              /tmp/notarize-results.md
          fi

  sync-oss:
    needs: [setup, finalize, notarize]
    # Run after ALL builds are done AND macOS notarization is complete.
    # The notarized (stapled) DMGs have already been re-uploaded to GitHub Release
    # by the notarize job, so we can safely mirror everything to OSS now.
    if: >-
      always() &&
      needs.setup.outputs.should_release == 'true' &&
      needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: oss-cn-hongkong.aliyuncs.com
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      # ── Step 1: Download ALL release binaries from GitHub ──
      - name: Download release assets from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"
          mkdir -p /tmp/release-assets

          # Only download installer binaries (skip source archives)
          gh release download "$TAG" \
            --repo Xinyuan-LilyGO/LILYGO-Spark \
            --dir /tmp/release-assets \
            --pattern '*.dmg' \
            --pattern '*.exe' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.rpm'

          echo "=== Downloaded assets ==="
          ls -lh /tmp/release-assets/
          echo "Total: $(du -sh /tmp/release-assets/ | cut -f1)"

      # ── Step 2: Upload binaries to OSS ──
      - name: Upload binaries to OSS
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"

          FAIL=0
          for f in /tmp/release-assets/*; do
            fname=$(basename "$f")
            echo "Uploading $fname ($(du -h "$f" | cut -f1)) ..."
            if ! ossutil cp "$f" "oss://lilygo/spark-releases/${TAG}/${fname}" -f; then
              echo "::error::Failed to upload $fname"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Some binary uploads failed — aborting before updating latest JSON/JS"
            exit 1
          fi

          echo "All binaries uploaded to oss://lilygo/spark-releases/${TAG}/"

      # ── Step 3: Generate JSON + JS with OSS URLs (not GitHub URLs) ──
      - name: Generate release-info.json and spark-latest.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"
          VERSION="${{ needs.setup.outputs.build_version }}"
          IS_PRE="${{ needs.setup.outputs.is_prerelease }}"
          OSS_BASE="https://lilygo.oss-accelerate.aliyuncs.com/spark-releases/${TAG}"

          # Fetch release metadata from GitHub (for asset names/sizes)
          RELEASE_JSON=$(gh api "repos/Xinyuan-LilyGO/LILYGO-Spark/releases/tags/${TAG}")
          PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at')

          # Asset key → filename suffix pattern
          declare -A PATTERNS=(
            ["macOS-arm64"]="macOS-arm64.dmg"
            ["macOS-x64"]="macOS-x64.dmg"
            ["macOS-universal"]="macOS-universal.dmg"
            ["windows-x64-setup"]="windows-x64-setup.exe"
            ["windows-x64-portable"]="windows-x64-portable.exe"
            ["windows-arm64-setup"]="windows-arm64-setup.exe"
            ["linux-x86_64-AppImage"]="linux-x86_64.AppImage"
            ["linux-amd64-deb"]="linux-amd64.deb"
            ["linux-x86_64-rpm"]="linux-x86_64.rpm"
          )

          # Build assets JSON with OSS download URLs
          ASSETS_JSON="{}"
          for key in "${!PATTERNS[@]}"; do
            suffix="${PATTERNS[$key]}"
            ASSET=$(echo "$RELEASE_JSON" | jq -r --arg s "$suffix" \
              '.assets[] | select(.name | endswith($s)) | {name, size}')
            if [ -n "$ASSET" ] && [ "$ASSET" != "null" ]; then
              ASSET_NAME=$(echo "$ASSET" | jq -r '.name')
              ASSET_SIZE=$(echo "$ASSET" | jq -r '.size')
              ASSETS_JSON=$(echo "$ASSETS_JSON" | jq \
                --arg k "$key" \
                --arg name "$ASSET_NAME" \
                --argjson size "$ASSET_SIZE" \
                --arg url "${OSS_BASE}/${ASSET_NAME}" \
                '. + {($k): {name: $name, size: $size, url: $url}}')
            fi
          done

          # release-info.json
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg published_at "$PUBLISHED_AT" \
            --arg is_prerelease "$IS_PRE" \
            --argjson assets "$ASSETS_JSON" \
            '{
              version: $version,
              tag: $tag,
              published_at: $published_at,
              is_prerelease: ($is_prerelease == "true"),
              assets: $assets
            }' > /tmp/release-info.json

          echo "=== release-info.json ==="
          cat /tmp/release-info.json | jq .

          # spark-latest.js — bake JSON into the widget template
          COMPACT_JSON=$(cat /tmp/release-info.json | jq -c .)
          node -e "
            const fs = require('fs');
            const tpl = fs.readFileSync('.github/scripts/spark-widget-template.js', 'utf8');
            const data = process.argv[1];
            fs.writeFileSync('/tmp/spark-latest.js', tpl.replace('__RELEASE_DATA__', data));
          " "$COMPACT_JSON"

          echo "=== spark-latest.js generated ($(wc -c < /tmp/spark-latest.js) bytes) ==="

      # ── Step 4: Update latest/ on OSS (atomic — only after binaries are confirmed) ──
      - name: Publish latest JSON and JS to OSS
        run: |
          TAG="${{ needs.setup.outputs.tag_name }}"

          # Versioned copy
          ossutil cp /tmp/release-info.json "oss://lilygo/spark-releases/${TAG}/release-info.json" -f
          ossutil cp /tmp/spark-latest.js   "oss://lilygo/spark-releases/${TAG}/spark-latest.js"   -f

          # latest/ — this is what the wiki widget loads; update LAST
          ossutil cp /tmp/release-info.json oss://lilygo/spark-releases/latest/release-info.json -f
          ossutil cp /tmp/spark-latest.js   oss://lilygo/spark-releases/latest/spark-latest.js   -f \
            --meta "Cache-Control:public, max-age=300"

          echo "Published:"
          echo "  spark-releases/${TAG}/  (binaries + JSON + JS)"
          echo "  spark-releases/latest/  (JSON + JS)"

      # ── Step 5: Clean up old versions (keep latest 5) ──
      - name: Cleanup old OSS versions
        run: |
          KEEP=5

          # List all versioned directories under spark-releases/
          VERSIONS=$(ossutil ls oss://lilygo/spark-releases/ -d 2>/dev/null \
            | grep -oE 'spark-releases/v[^/]+/' \
            | sed 's|spark-releases/||;s|/||' \
            | sort -V)

          COUNT=$(echo "$VERSIONS" | grep -c . || true)
          echo "Found $COUNT versions on OSS (keeping latest $KEEP)"

          if [ "$COUNT" -gt "$KEEP" ]; then
            DELETE_COUNT=$((COUNT - KEEP))
            TO_DELETE=$(echo "$VERSIONS" | head -n "$DELETE_COUNT")
            for ver in $TO_DELETE; do
              echo "Deleting old version: $ver"
              ossutil rm "oss://lilygo/spark-releases/${ver}/" --recursive --force || true
            done
            echo "Cleaned up $DELETE_COUNT old versions"
          fi
