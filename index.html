<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/LILYGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LILYGO Spark</title>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <script>
      (function(){try{var s=localStorage.getItem('lilygo_theme');var light=s==='light'||(s!=='dark'&&window.matchMedia('(prefers-color-scheme: light)').matches);document.body.style.backgroundColor=light?'#f8fafc':'#18181b';document.body.style.transition='background-color .2s';}catch(e){}})();
    </script>
    <div id="root">
      <div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background-color:#18181b;z-index:9999;color:#71717a;font-family:system-ui,-apple-system,sans-serif;">
         <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
           <div style="width:20px;height:20px;border:2px solid #3f3f46;border-top-color:#a1a1aa;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
         </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
